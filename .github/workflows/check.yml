name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # 每天 UTC 21:00（北京 05:00）

jobs:
  static-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dsh CLI + pnpm
        run: npm i -g @deepseek-ai/dsh pnpm
      - name: Source sync + syntax gates
        run: |
          python3 scripts/gen-static.py --check
          node --check src/index.js
          node --check src/client/index.js
      - name: Offline unit tests (mock shell, no network)
        run: |
          node qa/unit.mjs
          node qa/cookie.mjs
      - name: Static install smoke (real user path)
        run: bash scripts/static-smoke.sh
        env:
          SMOKE_PORT: 3199
          SMOKE_CI: 1

  # 雪球真实接口契约：无 XQ_COOKIE secret 时自动 skip（push/PR 安全）
  # 每日定时用 secret Cookie 真跑，雪球改接口时这里最先失败（防 watch.json 类事故）
  live-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Contract test (cloud watchlist endpoints)
        run: node qa/contract.mjs
        env:
          XQ_COOKIE: ${{ secrets.XQ_COOKIE }}
      - name: Live API test (51 assertions)
        run: node qa/live.mjs

  # Windows 支持：DSH win32 层 shell 为 PowerShell。curl.exe 显式调用绕开 PS 5.1 的
  # Invoke-WebRequest 别名；live.mjs 走 pwsh realShell 真连雪球（含匿名 Cookie 播种链路）。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Source sync + syntax gates
        run: |
          python scripts/gen-static.py --check
          node --check src/index.js
          node --check src/client/index.js
      - name: Offline unit tests (mock shell, no network)
        run: |
          node qa/unit.mjs
          node qa/cookie.mjs
      - name: Live API test via pwsh shell (real Xueqiu, anonymous)
        run: node qa/live.mjs
      # 真 Win10 老用户环境：DSH win32 层在无 pwsh 7 时回退 powershell.exe(5.1)。
      # XQ_FORCE_PS51=1 强制测试桩走同款回退 + UTF-8 编码声明（5.1 OEM 代码页防中文乱码）。
      - name: Live API test via Windows PowerShell 5.1 fallback (real Xueqiu)
        run: node qa/live.mjs
        env:
          XQ_FORCE_PS51: '1'
